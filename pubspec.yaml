name: android_app
description: "W Distro — Buyer-facing wholesale ordering app."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  file_picker: ^8.0.0
  mobile_scanner: ^6.0.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
